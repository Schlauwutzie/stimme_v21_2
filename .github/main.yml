name: Build V21.2 Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V21.2 Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Verify project files
        shell: pwsh
        run: |
          if (!(Test-Path "app.py")) { throw "app.py fehlt." }
          if (!(Test-Path "SchlauWutzie_V21_2_FINAL.spec")) { throw "V21.2 SPEC fehlt." }
          if (!(Test-Path "assets\schlawutzie.png")) { throw "assets\schlawutzie.png fehlt." }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify PyWinRT
        shell: pwsh
        run: |
          python -c "import winrt.windows.foundation; import winrt.windows.foundation.collections; import winrt.windows.media.speechsynthesis; import winrt.windows.storage; import winrt.windows.storage.streams; from winrt.windows.media.speechsynthesis import SpeechSynthesizer; from winrt.windows.storage.streams import DataReader; print('PyWinRT OK')"

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile app.py

      - name: Build V21.2 EXE
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build, dist
          python -m PyInstaller --clean --noconfirm SchlauWutzie_V21_2_FINAL.spec
          $exe = "dist\SchlauWutzie_V21_2_FINAL.exe"
          if (!(Test-Path $exe)) { throw "V21.2 EXE wurde nicht erzeugt." }
          $size = (Get-Item $exe).Length
          Write-Host "V21.2 EXE size: $size bytes"
          if ($size -lt 1000000) { throw "EXE ist unerwartet klein." }

      - name: Upload V21.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchlauWutzie_V21_2_FINAL-Windows-x64
          path: dist/SchlauWutzie_V21_2_FINAL.exe
          if-no-files-found: error
          retention-days: 14
