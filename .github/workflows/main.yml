name: Build V22.5 EXTERNAL MODEL FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Verify project
        shell: pwsh
        run: |
          if (!(Test-Path "app.py")) { throw "app.py fehlt." }
          if (!(Test-Path "SchlauWutzie_V22_5_EXTERNAL_MODEL_FINAL.spec")) { throw "SPEC fehlt." }
          if (!(Test-Path "assets\schlawutzie.png")) { throw "Bild fehlt." }
          if (!(Test-Path "assets\SchlauWutzie_KI_AI_Datacenter_Intro_V4_FINAL.mp4")) { throw "Intro fehlt." }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download Faster-Whisper model externally
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='mobiuslabsgmbh/faster-whisper-large-v3-turbo', local_dir='models\faster-whisper-large-v3-turbo')"

      - name: Verify external model
        shell: pwsh
        run: |
          if (!(Test-Path "models\faster-whisper-large-v3-turbo\model.bin")) { throw "model.bin fehlt." }
          if (!(Test-Path "models\faster-whisper-large-v3-turbo\config.json")) { throw "config.json fehlt." }
          if (!(Test-Path "models\faster-whisper-large-v3-turbo\tokenizer.json")) { throw "tokenizer.json fehlt." }
          $size = (Get-Item "models\faster-whisper-large-v3-turbo\model.bin").Length
          Write-Host "Model size: $size bytes"
          if ($size -lt 500000000) { throw "Modell zu klein." }

      - name: Verify Faster-Whisper
        shell: pwsh
        run: |
          python -c "import requests; from faster_whisper import WhisperModel; import ctranslate2; print('requests', requests.__version__); print('faster-whisper OK'); print('ctranslate2', ctranslate2.__version__)"

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile app.py

      - name: Build
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build, dist
          python -m PyInstaller --clean --noconfirm SchlauWutzie_V22_5_EXTERNAL_MODEL_FINAL.spec
          $exe = "dist\SchlauWutzie_V22_5_EXTERNAL_MODEL_FINAL.exe"
          if (!(Test-Path $exe)) { throw "EXE wurde nicht erzeugt." }
          $size = (Get-Item $exe).Length
          if ($size -lt 100000000) { throw "EXE ist verdächtig klein." }
          New-Item -ItemType Directory -Force "dist\SchlauWutzie_V22_5_EXTERNAL_MODEL_FINAL\models" | Out-Null
          Copy-Item -Recurse -Force "models\faster-whisper-large-v3-turbo" "dist\SchlauWutzie_V22_5_EXTERNAL_MODEL_FINAL\models\"
          Copy-Item "$exe" "dist\SchlauWutzie_V22_5_EXTERNAL_MODEL_FINAL\"
          Compress-Archive -Path "dist\SchlauWutzie_V22_5_EXTERNAL_MODEL_FINAL\*" -DestinationPath "dist\SchlauWutzie_V22_5_EXTERNAL_MODEL_FINAL-Windows-x64.zip" -Force
          Write-Host "EXE size: $size bytes"

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: SchlauWutzie_V22_5_EXTERNAL_MODEL_FINAL-Windows-x64
          path: dist/SchlauWutzie_V22_5_EXTERNAL_MODEL_FINAL-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
