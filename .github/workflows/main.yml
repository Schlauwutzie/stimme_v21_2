name: Build V22.5 FINAL – Faster-Whisper German subtitles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V22.5 FINAL
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Verify project
        shell: pwsh
        run: |
          if (!(Test-Path "app.py")) { throw "app.py fehlt." }
          if (!(Test-Path "SchlauWutzie_V22_5_FINAL_FASTER_WHISPER.spec")) { throw "V22.5 SPEC fehlt." }
          if (!(Test-Path "assets\schlawutzie.png")) { throw "Bild fehlt." }
          if (!(Test-Path "assets\SchlauWutzie_KI_AI_Datacenter_Intro_V4_FINAL.mp4")) { throw "Intro fehlt." }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download Faster-Whisper large-v3-turbo model
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='mobiuslabsgmbh/faster-whisper-large-v3-turbo', local_dir='models/faster-whisper-large-v3-turbo', allow_patterns=['config.json','preprocessor_config.json','model.bin','tokenizer.json','vocabulary.*'])"

      - name: Verify model
        shell: pwsh
        run: |
          if (!(Test-Path "models\faster-whisper-large-v3-turbo\model.bin")) { throw "Faster-Whisper Modell fehlt." }
          $size = (Get-Item "models\faster-whisper-large-v3-turbo\model.bin").Length
          Write-Host "Faster-Whisper model.bin: $size bytes"
          if ($size -lt 500000000) { throw "Faster-Whisper Modell ist unerwartet klein." }

      - name: Verify Faster-Whisper engine
        shell: pwsh
        run: |
          python -c "import requests; from faster_whisper import WhisperModel; import ctranslate2; print('requests OK', requests.__version__); print('faster-whisper OK'); print('ctranslate2', ctranslate2.__version__)"

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile app.py

      - name: ASR smoke test
        shell: pwsh
        run: |
          python -c "import wave, struct; w=wave.open('smoke.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(struct.pack('<h',0)*32000); w.close()"
          python -c "from faster_whisper import WhisperModel; m=WhisperModel('models/faster-whisper-large-v3-turbo', device='cpu', compute_type='int8', cpu_threads=4, num_workers=1); s,i=m.transcribe('smoke.wav', language='de', word_timestamps=True, condition_on_previous_text=False, vad_filter=True); print(list(s)); print('SMOKE OK')"

      - name: Build V22.5
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build, dist
          python -m PyInstaller --clean --noconfirm SchlauWutzie_V22_5_FINAL_FASTER_WHISPER.spec
          $exe = "dist\SchlauWutzie_V22_5_FINAL_FASTER_WHISPER.exe"
          if (!(Test-Path $exe)) { throw "V22.5 EXE wurde nicht erzeugt." }
          $size = (Get-Item $exe).Length
          if ($size -lt 500000000) { throw "V22.5 EXE ist verdächtig klein." }
          Write-Host "V22.5 EXE size: $size bytes"

      - name: Upload V22.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchlauWutzie_V22_5_FINAL_FASTER_WHISPER-Windows-x64
          path: dist/SchlauWutzie_V22_5_FINAL_FASTER_WHISPER.exe
          if-no-files-found: error
          retention-days: 14
