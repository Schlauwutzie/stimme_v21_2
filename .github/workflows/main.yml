name: Build V22.3 FINAL – DTW Large-v3-Turbo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V22.3 FINAL
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Verify project
        shell: pwsh
        run: |
          if (!(Test-Path "app.py")) { throw "app.py fehlt." }
          if (!(Test-Path "SchlauWutzie_V22_3_DTW_LARGE_V3_TURBO_FINAL.spec")) { throw "V22.3 SPEC fehlt." }
          if (!(Test-Path "assets\schlawutzie.png")) { throw "Hintergrundbild fehlt." }
          if (!(Test-Path "assets\SchlauWutzie_KI_AI_Datacenter_Intro_V4_FINAL.mp4")) { throw "Intro-MP4 fehlt." }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download whisper.cpp v1.9.1 Windows x64 runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "whisper_runtime" | Out-Null
          curl.exe -L --fail -o "whisper-bin-x64.zip" "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-bin-x64.zip"
          Expand-Archive -Force "whisper-bin-x64.zip" "whisper_runtime_unpack"
          $cli = Get-ChildItem -Path "whisper_runtime_unpack" -Filter "whisper-cli.exe" -Recurse | Select-Object -First 1
          if (!$cli) { throw "whisper-cli.exe wurde im offiziellen Paket nicht gefunden." }
          Copy-Item -Recurse -Force (Join-Path $cli.Directory.FullName "*") "whisper_runtime\"
          if (!(Test-Path "whisper_runtime\whisper-cli.exe")) { throw "whisper-cli.exe fehlt." }

      - name: Download Large-v3-Turbo q5_0 model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "whisper_models" | Out-Null
          curl.exe -L --fail -o "whisper_models\ggml-large-v3-turbo-q5_0.bin" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin?download=true"

      - name: Verify Large-v3-Turbo q5_0 SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "whisper_models\ggml-large-v3-turbo-q5_0.bin" -Algorithm SHA256).Hash.ToLower()
          $expected = "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2"
          if ($hash -ne $expected) {
            throw "Large-v3-Turbo q5_0 SHA256 stimmt nicht."
          }
          Write-Host "Large-v3-Turbo q5_0 SHA256 OK."

      - name: Whisper DTW smoke test
        shell: pwsh
        run: |
          python -c "import wave, struct; w=wave.open('smoke.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(struct.pack('<h',0)*32000); w.close()"
          & "whisper_runtime\whisper-cli.exe" `
            -m "whisper_models\ggml-large-v3-turbo-q5_0.bin" `
            -f "smoke.wav" `
            -l de `
            -ng `
            -t 4 `
            -p 1 `
            -bs 2 `
            -bo 2 `
            -dtw large.v3.turbo `
            -ojf `
            -of smoke `
            -np `
            -nf
          if (!(Test-Path "smoke.json")) { throw "DTW Smoke-Test fehlgeschlagen." }

      - name: Subtitle timing self-test
        shell: pwsh
        run: |
          python subtitle_timing_selftest.py

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile app.py

      - name: Build V22.3
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build, dist
          python -m PyInstaller --clean --noconfirm SchlauWutzie_V22_3_DTW_LARGE_V3_TURBO_FINAL.spec
          $exe = "dist\SchlauWutzie_V22_3_DTW_LARGE_V3_TURBO_FINAL.exe"
          if (!(Test-Path $exe)) { throw "V22.3 EXE wurde nicht erzeugt." }
          $size = (Get-Item $exe).Length
          if ($size -lt 500000000) { throw "V22.3 EXE ist verdächtig klein; Modell fehlt wahrscheinlich." }
          Write-Host "V22.3 EXE size: $size bytes"

      - name: Upload V22.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchlauWutzie_V22_3_DTW_LARGE_V3_TURBO_FINAL-Windows-x64
          path: dist/SchlauWutzie_V22_3_DTW_LARGE_V3_TURBO_FINAL.exe
          if-no-files-found: error
          retention-days: 14
