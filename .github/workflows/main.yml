name: Build V22 FINAL – stable V21.5 core + whisper.cpp subtitles

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V22 FINAL
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Verify project
        shell: pwsh
        run: |
          if (!(Test-Path "app.py")) { throw "app.py fehlt." }
          if (!(Test-Path "SchlauWutzie_V22_FINAL.spec")) { throw "V22 SPEC fehlt." }
          if (!(Test-Path "assets\schlawutzie.png")) { throw "Hintergrundbild fehlt." }
          if (!(Test-Path "assets\SchlauWutzie_KI_AI_Datacenter_Intro_V4_FINAL.mp4")) { throw "Intro-MP4 fehlt." }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify PyWinRT
        shell: pwsh
        run: |
          python -c "import winrt.windows.foundation; import winrt.windows.foundation.collections; import winrt.windows.media.speechsynthesis; import winrt.windows.storage.streams; print('PyWinRT OK')"

      - name: Download whisper.cpp v1.9.1 Windows x64 runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "whisper_runtime" | Out-Null
          curl.exe -L --fail -o "whisper-bin-x64.zip" "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-bin-x64.zip"
          Expand-Archive -Force "whisper-bin-x64.zip" "whisper_runtime_unpack"
          $cli = Get-ChildItem -Path "whisper_runtime_unpack" -Filter "whisper-cli.exe" -Recurse | Select-Object -First 1
          if (!$cli) { throw "whisper-cli.exe wurde im offiziellen Paket nicht gefunden." }
          Copy-Item -Recurse -Force (Join-Path $cli.Directory.FullName "*") "whisper_runtime\"
          if (!(Test-Path "whisper_runtime\whisper-cli.exe")) { throw "whisper-cli.exe fehlt." }
          & "whisper_runtime\whisper-cli.exe" --help | Select-Object -First 5

      - name: Download whisper small q5_1 model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "whisper_models" | Out-Null
          curl.exe -L --fail -o "whisper_models\ggml-small-q5_1.bin" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true"

      - name: Verify Whisper model SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "whisper_models\ggml-small-q5_1.bin" -Algorithm SHA256).Hash.ToLower()
          $expected = "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb"
          if ($hash -ne $expected) { throw "Whisper-Modell SHA256 stimmt nicht." }
          Write-Host "Whisper model SHA256 OK."

      - name: Whisper CLI smoke test
        shell: pwsh
        run: |
          python -c "import wave, struct; w=wave.open('smoke.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(struct.pack('<h',0)*16000); w.close()"
          & "whisper_runtime\whisper-cli.exe" -m "whisper_models\ggml-small-q5_1.bin" -f "smoke.wav" -l de -t 4 -p 1 -ml 1 -sow -oj -of "smoke" -np -nf
          if (!(Test-Path "smoke.json")) { throw "Whisper Smoke-Test fehlgeschlagen." }

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile app.py

      - name: Build V22
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build, dist
          python -m PyInstaller --clean --noconfirm SchlauWutzie_V22_FINAL.spec
          $exe = "dist\SchlauWutzie_V22_FINAL.exe"
          if (!(Test-Path $exe)) { throw "V22 EXE wurde nicht erzeugt." }
          $size = (Get-Item $exe).Length
          if ($size -lt 150000000) { throw "V22 EXE ist verdächtig klein; Runtime oder Modell fehlen." }
          Write-Host "V22 EXE size: $size bytes"

      - name: Upload V22 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchlauWutzie_V22_FINAL-Windows-x64
          path: dist/SchlauWutzie_V22_FINAL.exe
          if-no-files-found: error
          retention-days: 14
